<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Attendance Portal{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5d6878; --line: #e2e6ec;
    --accent: #2457c5; --present: #1f8a4c; --present-bg: #e3f4ea; --absent: #b3261e; --absent-bg: #fbe7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1a2029; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b3340;
      --accent: #7aa2ff; --present: #6fd39b; --present-bg: #183526; --absent: #ff8a80; --absent-bg: #3a1d1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
  .brand { font-weight: 700; color: var(--text); text-decoration: none; }
  .bar .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a { color: var(--accent); }
  a.card { display: block; text-decoration: none; color: var(--text); }
  a.card:hover { border-color: var(--accent); }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
                 border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--text); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--card); }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; white-space: nowrap; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .mark { border: 0; border-radius: 6px; padding: 2px 8px; font-weight: 600; font-size: .85rem; }
  .present { background: var(--present-bg); color: var(--present); }
  .absent { background: var(--absent-bg); color: var(--absent); }
  .manual { outline: 1px dashed currentColor; }
  .error { color: var(--absent); }
  form.inline { display: inline; margin: 0; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/dashboard">Attendance Portal</a>
  <span class="spacer"></span>
  {% if teacher %}<span class="muted">{{ teacher.name }}</span>
  <form class="inline" method="post" action="/logout"><button>Log out</button></form>{% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
